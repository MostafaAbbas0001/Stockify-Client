name: stockify-client

services:
  client:
    build:
      context: .
      dockerfile: Dockerfile

    image: stockify-client:latest
    container_name: stockify-client
    restart: unless-stopped

    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      STOCKIFY_API_URL: http://server:8080

    ports:
      - "${STOCKIFY_CLIENT_PORT:-3000}:3000"

    networks:
      - stockify-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  stockify-network:
    external: true